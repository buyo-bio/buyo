  formula: 'pool = M03 deals where modality≈ & phase= & disease_group≈ (N ≥ 5, 아니면 조건 완화하고 badge=pool_widened)

    percentile(upfront), percentile(total), quartiles 표시. 포인트 추정·평균 금지

    '
  outputs:
