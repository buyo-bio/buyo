- id: CE-01
  group: C_axis
  name: 층화 성공확률 조회
  question: 이 모달리티·질환군·단계의 조건부·누적 성공확률은 얼마인가
  inputs:
  - modality
  - disease_group
  - phase
  - rare
  formula: 'lookup C01 where modality ∈ {입력, 상위 태그, null} ∧ disease_group ∈ {입력, 전체} ∧ phase = 입력

    우선순위: (모달리티 일치 ∧ 질환군 일치) > (모달리티 일치) > (질환군 일치) > 전체. 선택된 행의 출처·n·데이터 기간을 함께 반환

    기본 출처 규칙: BIO 2021 기본, Wong 2019는 희귀·개별시험 기간·낙관 상한·BIO 미제공 분류에서 기본 화면(C04 규칙 청크)

    rare=Y: 질환군 값 첫 줄 + 희귀 값(Wong orphan) 둘째 줄. 두 값을 곱하거나 평균하지 않는다

    누적(cumulative)과 조건부(conditional)는 별도 필드로 반환. 재곱 금지

    '
  outputs:
  - cum_LOA
  - transition_p_list
  - source_rows
  - badges
  params:
  - C01:성공확률 표
  - C04:출처 우선순위·표시 규칙
  mvp: true
  status: ready
  pattern: LOOKUP
- id: CE-02
  group: C_axis
  name: 단계 기간 조회
  question: 다음 단계까지 몇 년 걸리는가
  inputs:
  - phase
  - phase_to
  - disease_group
  formula: 'program_duration = C02 where duration_kind = program_phase_transition (BIO) — 프로그램 기준, 기본 표시

    single_trial     = C02 where duration_kind = single_trial (Wong) — 시험 1건 기준, 상세에만. 둘을 합치지 않는다

    '
  outputs:
