  status: blocked
  pattern: MATCH
- id: RE-03
  group: R_axis
  name: 독점권·데이터 보호 기간
  question: 특허와 별개로 몇 년의 배타권이 생기는가
  inputs:
  - jurisdiction
  - modality
  - regulatory_path
  - rare
  formula: 'exclusivity = max over applicable {NCE 5y(US), biologic 12y(US), orphan 7y(US)/10y(EU·JP), KR 재심사 4~6y·희귀 10y 허가유효, 소아 +6m(US)}

    FE-B02 effective_loe = max(patent_expiry, approval_year + exclusivity)

    '
  outputs:
