  formula: 'lookup M02 where disease_code = 입력 ∧ jurisdiction ∈ 입력. metric(prevalence/incidence)·reference_year·source 반환

    값이 없으면 상위 코드(MeSH tree 부모)로 완화하고 badge=code_widened. 그래도 없으면 ''미확보''

