  - phase
  formula: 'pool = CT.gov 레코드 where conditions ∋ indication_code ∧ phase = 입력 ∧ status ∈ {completed, active} (최근 10년)

    quartiles(enrollment), N. planned_n의 백분위. N < 20이면 상위 질환군으로 완화(badge)

    '
  outputs:
