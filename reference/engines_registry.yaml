  inputs:
  - modality
  - disease_group
  - phase
  - as_of
  formula: 'pool = 485사 DB에서 (modality 일치 or 상위 태그) ∧ (disease_group 일치) ∧ (해당 시점에 같은 단계 자산 보유)

    if N < 5: disease_group 완화 → modality만 → 단계만 (완화 단계마다 badge)

    각 비교사에 대해 stage_date = 그 회사가 같은 단계에 있던 시점(DART 공시·CT.gov 기준)

