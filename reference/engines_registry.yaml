  status: formal
  pattern: CALC
- id: CE-06
  group: C_axis
  name: 임상 데이터 신뢰 게이트
  question: 이 확률·기간 값을 화면 첫 줄에 써도 되는가
  inputs:
  - source_rows
  formula: 'badge small_sample if n < 10; badge limited_mapping if illustrative; badge expired if temporal_validity 지남

    첫 줄 표시 조건: badge 없음 ∧ trust_tier ≤ 2. 아니면 둘째 줄 또는 상세

    '
  outputs:
