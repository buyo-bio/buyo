  formula: 'rule chunks(R01): 신약 / 자료제출의약품(7유형, 505(b)(2)) / 개량신약(5유형) / 바이오시밀러 / 생물학적제제(첨단재생바이오)

    출력: 가능한 경로 목록 + 각 경로가 요구하는 자료 범위(전체 자료 vs 일부 생략) + 근거 조문

