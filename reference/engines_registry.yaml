- id: ME-06
  group: M_axis
  name: 점유율·램프 프리셋
  question: 몇 번째 진입자로서 정점에 몇 %를 가져가고 몇 년 걸리는가
  inputs:
  - entry_order_estimate
  - competitor_n
  - disease_group
  formula: 'share_peak(low/base/high) = M04 프리셋(진입 순서 × 경쟁 수) ; years_to_peak = M04 램프 프리셋(질환군)

    FE-B01·B02의 입력. 프리셋 출처 없으면 ''미확보''

    '
  outputs:
