  - ramp_curve
  params:
  - M04:점유·램프 프리셋 표
  mvp: false
  status: blocked
  pattern: CALC
- id: ME-07
  group: M_axis
  name: 시장 규모 등급(피크매출 대체)
  question: 피크매출을 못 낼 때 시장 규모를 등급으로라도 말할 수 있는가
  inputs:
  - prevalence_KR
  - prevalence_US
  - annual_net_price_range
  formula: 'addressable_value_ceiling = Σ_j prevalence_j × annual_net_price_j (치료율·점유율 곱하지 않은 상한)

    등급: <500억 S / 500억~5천억 M / >5천억 L (원화 환산, 규칙 청크). 상한임을 명시. 유병·약가 중 하나라도 없으면 미확보

    '
  outputs:
  - ceiling_value
  - size_grade
  params:
  - M02:역학 표
  - M01:참조약가
  - M04:등급 규칙
  mvp: true
  status: blocked
  pattern: CALC
