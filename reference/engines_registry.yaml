  - client_percentile
  - pool_n
  params:
  - F06:비교군 완화 규칙(CT.gov 적용)
  mvp: true
  status: ready
  pattern: CALC
- id: CE-04
  group: C_axis
  name: 설계안 플래그 규칙
  question: 이 설계에서 심사위원이 바로 지적할 항목이 있는가
  inputs:
  - primary_endpoint
  - comparator
  - planned_n
  - planned_duration_m
  - disease_group
  - phase
  formula: "rule chunks(C04·C05) 매칭. MVP 규칙 3개:\n  (1) 대리 평가변수(ORR·바이오마커) + 항암 아닌 질환군 → caution \"규제 수용 여부 확인(R06)\"\n  (2) single_arm + P3 → caution / single_arm + P2 + 항암 → neutral\n  (3) planned_n <\
    \ CE-03 Q1 → caution \"검정력 근거 요구\"\n플래그는 rule 청크 flag_hint로만 결정한다\n"
  outputs:
