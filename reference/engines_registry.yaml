  group: C
  name: 비교군 딜 추출
  question: 그들은 어느 단계에서 얼마에 기술이전했나
  inputs:
  - comps_list
  formula: 'DART 주요사항보고서(기술이전) 파싱 → upfront, total, counterpart, phase_at_deal → M03 표에 적재(source=dart)

