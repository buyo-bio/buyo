  params:
  - F06:기술이전 공시 파싱 규칙
  mvp: false
  status: formal
  pattern: CALC
- id: FE-C05
  group: C
  name: 시장이 지불한 단계 가치
  question: 한국 시장은 P1·P2 자산 하나를 얼마로 봤나
  inputs:
