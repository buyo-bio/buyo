version: 1.0
dimensions:
  modality:
  - small_molecule
  - antibody
  - antibody_mAb
  - ADC
  - cell_therapy
  - gene_therapy
  - peptide
  - vaccine
  - biosimilar
  - other
  phase:
  - preclinical
  - P1
  - P2
  - P3
  - NDA
  disease_group:
  - 항암
  - 감염
  - 중추신경(신경)
  - 중추신경(정신)
  - 대사·내분비
  - 심혈관
  - 기타
  rare:
  - Y
  - N
  financial_state:
  - S1_pre_revenue_clean
  - S2_convertible_or_pref
  - S3_grant_dependent
  - S4_has_license_income
  - S5_listed
  - S6_distressed
  exit_route:
  - license_out
  - self_develop
  regulatory_path:
  - full_nda
  - accelerated_oncology
  - orphan
  - 505b2_imd
  - biosimilar
groups:
  A: 도달성 — 지금 자본으로 다음 변곡점까지 가는가
  B: 자산 가치 — 도달했을 때 얼마의 가치가 생기는가
  C: 비교군 — 같은 처지였던 상장사(DART)는 어땠는가
  D: 상태 분류 — 어떤 산식을 적용할지 정하는 분류기
engines:
- id: FE-D01
  group: D
  name: 재무 상태 분류
  question: 이 회사에 어떤 산식 묶음을 적용하는가
  inputs:
  - cash
  - monthly_burn
  - debt
  - convertible_instruments_list
  - grant_commitments_list
  - license_income_ttm
  - listed_flag
  formula: "state = S6 if runway_m < 6\n      else S5 if listed_flag\n      else S2 if any(convertible_instruments)\n      else S3 if grant_committed / (grant_committed + cash) > 0.3\n      else S4 if license_income_ttm\
    \ > 0\n      else S1\n# 복수 해당 시 우선순위 S6 > S5 > S2 > S3 > S4 > S1. 결과는 routing 태그이며 화면에 표시하지 않는다.\n"
  outputs:
  - financial_state
  params: []
  mvp: true
  status: ready
  pattern: CALC
- id: FE-D02
  group: D
  name: 다음 변곡점 결정
  question: 여기까지의 기준점(변곡점)을 무엇으로 잡는가
  inputs:
  - phase
  - exit_route
  - regulatory_path
  formula: "next_inflection:\n  preclinical            → IND_filing (self_develop·license_out 공통)\n  P1, license_out        → P2_PoC_readout\n  P1, self_develop       → P3_start\n  P2, license_out     \
    \   → P2_PoC_readout (진행 중이면 readout)\n  P2, self_develop       → P3_start  ; accelerated_oncology이면 NDA_filing\n  P3                     → NDA_filing\n  NDA                    → approval\nstages_to_inflection\
    \ = 현재 단계부터 변곡점 직전 단계까지의 단계 목록\n"
  outputs:
  - next_inflection
  - stages_to_inflection
  params:
  - R01:경로별 단계 구성(accelerated·505b2·biosimilar는 단계가 다름)
  mvp: true
  status: ready
  pattern: MATCH
- id: FE-A01
  group: A
  name: 런웨이
  question: 지금 돈으로 몇 달 버티는가
  inputs:
  - cash
  - restricted_cash
  - monthly_burn
  - committed_raise
  formula: 'cash_available = cash - restricted_cash            # 정부과제 전용 현금은 제외(S3)

    runway_m       = cash_available / monthly_burn

    runway_m_committed = (cash_available + committed_raise) / monthly_burn

    # monthly_burn = 최근 6개월 영업현금유출 평균. 자료가 1개월치뿐이면 badge=burn_single_month

    '
  outputs:
  - runway_m
  - runway_m_committed
  - cash_out_date
  params: []
  mvp: true
  status: ready
  pattern: CALC
- id: FE-A02
  group: A
  name: 변곡점까지 필요자금 — 벤치마크 경로
  question: 다음 변곡점까지 산업 기준으로 얼마가 드는가
  inputs:
  - stages_to_inflection
  - modality
  - disease_group
  - rare
  formula: "need_bench = Σ_{s ∈ stages} cost_bench(s) × modality_factor(modality) × rare_factor(rare)\n           + fixed_opex_m × duration_bench(stages)\n           + cmc_cost(modality, stages)\n     \
    \      + contingency\ncontingency = monthly_burn × duration_bench × delay_factor      # 지연 버퍼\n# cost_bench = C03 default(DiMasi mean, BRDPI 환산 현재가), duration_bench = C02 program_phase_transition\n\
    # modality_factor·rare_factor·cmc_cost는 parameter 청크. 없으면 1.0·0으로 두지 않고 해당 항을 '미확보'로 표시하고 부분합만 낸다\n"
  outputs:
  - need_bench
  - need_bench_breakdown
  - duration_bench
  params:
  - C03:단계 비용
  - C02:단계 기간
  - F04:모달리티 비용 계수
  - F04:희귀 비용 계수
  - F04:CMC·제조 준비 비용(모달리티별)
  - F04:지연 계수
  - F01:고정비 처리 규칙
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-A03
  group: A
  name: 변곡점까지 필요자금 — 설계안 경로(bottom-up)
  question: 이 설계안(대상자 수·기간·지역)으로는 얼마가 드는가
  inputs:
  - planned_n
  - planned_duration_m
  - sites
  - regions_list
  - comparator
  - primary_endpoint
  - modality
  formula: "trial_cost = planned_n × cost_per_patient(disease_group, phase, region)\n           + sites × site_startup_cost\n           + planned_duration_m × (cro_monthly + internal_monthly)\n        \
    \   + comparator_drug_cost(comparator)                 # active comparator면 약제비 추가\n           + cmc_cost(modality)\nneed_design = trial_cost + fixed_opex_m × planned_duration_m + contingency\n# 벤치마크\
    \ 경로(FE-A02)와 나란히 표시. 둘의 차이가 ±40% 이상이면 flag=design_cost_outlier\n"
  outputs:
  - need_design
  - trial_cost_breakdown
  - cost_vs_bench_ratio
  params:
  - F04:환자당 비용(질환군×단계×지역)
  - F04:사이트 개설 비용
  - F04:CRO 월 비용
  - F04:대조약 비용 규칙
  mvp: false
  status: blocked
  pattern: CALC
- id: FE-A04
  group: A
  name: 자금 갭
  question: 얼마가 모자라는가, 언제 모자라는가
  inputs:
  - need
  - cash_available
  - committed_raise
  - planned_raise
  - planned_raise_date
  formula: 'gap_now      = need - (cash_available + committed_raise)          # 양수 = 부족

    gap_planned  = gap_now - planned_raise                             # 예정 조달이 다 되면

    shortfall_date = today + runway_m (from FE-A01)                   # 현금 소진 시점

    raise_deadline = shortfall_date - fundraising_lead_m               # 이 날짜 전에 조달 착수해야 함

    # need가 부분합(미확보 항 있음)이면 gap도 ''최소 갭''으로 표시

    '
  outputs:
  - gap_now
  - gap_planned
  - shortfall_date
  - raise_deadline
  params:
  - F01:조달 소요 기간(단계·규모별)
  mvp: true
  status: ready
  pattern: CALC
- id: FE-A05
  group: A
  name: 런웨이 커버리지 비율
  question: 변곡점 도달 전에 돈이 떨어질 위험이 있는가
  inputs:
  - runway_m_committed
  - duration_bench
  - delay_factor
  formula: 'RCR = runway_m_committed / (duration_bench × (1 + delay_factor))

    band: RCR ≥ 1.5 → 양호 / 1.0 ≤ RCR < 1.5 → 주의 / RCR < 1.0 → 미달

    # 확률로 바꾸지 않는다. 비율과 밴드만 표시(NONBLEND).

    '
  outputs:
  - RCR
  - band
  params:
  - C02:단계 기간
  - F04:지연 계수
  - F01:RCR 밴드 규칙
  mvp: true
  status: ready
  pattern: CALC
- id: FE-A06
  group: A
  name: 희석 추정
  question: 갭을 메우려면 지분을 얼마나 내주는가
  applies_when:
    financial_state:
    - S1_pre_revenue_clean
    - S2_convertible_or_pref
    - S3_grant_dependent
    - S4_has_license_income
  inputs:
  - gap_now
  - premoney_reference
  - existing_pref_terms_list
  formula: 'dilution_pct   = gap_now / (premoney_reference + gap_now)

    premoney_reference = 비교군 시장가치(FE-C05) 또는 rNPV_stage(FE-B03) × stage_haircut — 둘 다 표시, 하나로 합치지 않음

    S2: 기존 RCPS/CB의 전환·리픽싱 조건 반영 → fully diluted 기준 재계산(F02 워터폴 청크)

    '
  outputs:
  - dilution_pct_range
  - post_money_range
  params:
  - F02:단계별 프리머니 헤어컷
  - F02:전환·리픽싱 처리 규칙
  - C05:비교군 시장가치
  mvp: false
  status: formal
  pattern: CALC
- id: FE-A07
  group: A
  name: 비희석 자금 반영
  question: 정부과제·보조금은 얼마나 쓸 수 있는가
  applies_when:
    financial_state:
    - S3_grant_dependent
  inputs:
  - grant_commitments_list
  - matching_ratio
  - grant_restricted_use
  formula: 'grant_usable  = Σ grant_committed × usable_ratio(grant_restricted_use)

    matching_cash = Σ grant_committed × matching_ratio                # 회사가 따로 대야 하는 현금

    cash_available_adj = cash_available - matching_cash

    need_adj = need - grant_usable

    '
  outputs:
  - grant_usable
  - matching_cash
  - need_adj
  params:
  - F01:과제 유형별 사용 가능 비율 규칙
  - F01:매칭 비율 규칙
  mvp: false
  status: formal
  pattern: CALC
- id: FE-A08
  group: A
  name: 상환·풋 부담
  question: 변곡점 전에 갚아야 하는 돈이 있는가
  applies_when:
    financial_state:
    - S2_convertible_or_pref
    - S5_listed
  inputs:
  - convertible_instruments_list
  - debt_schedule_list
  - horizon_m
  formula: 'repay_risk = Σ_{i: put_date_i or maturity_i ≤ horizon} principal_i × P(put_exercised_i)

    P(put_exercised) = 1 if conversion_price > premoney_reference/share_count_fd else 0   # 전환가가 현 가치보다 높으면 풋 행사 가정

    need_adj = need + repay_risk

    '
  outputs:
  - repay_risk
  - instruments_at_risk_list
  params:
  - F02:풋 행사 가정 규칙
  - F02:리픽싱 하한 규칙
  mvp: false
  status: formal
  pattern: CALC
- id: FE-A09
  group: A
  name: 관리종목 요건 점검
  question: 상장사라면 법차손 요건에 걸리는가
  applies_when:
    financial_state:
    - S5_listed
  inputs:
  - net_loss_before_tax_3y_list
  - equity_3y_list
  - listing_type
  - exemption_end_year
  formula: 'ratio_y = net_loss_before_tax_y / equity_y

    flag = (count(ratio_y > 0.5 for last 3y) ≥ 2) and (today > exemption_end_year)

    # 기술특례 상장은 유예 기간 동안 미적용(F-D10 규칙 청크 재태깅)

    '
  outputs:
  - ratio_3y_list
  - flag
  - years_to_exemption_end
  params:
  - F05:관리종목 지정 요건(코스닥)
  - F05:기술특례 유예 규칙
  mvp: false
  status: formal
  pattern: MATCH
- id: FE-B01
  group: B
  name: 피크매출 빌드업 — 기본(만성·반복 투여)
  question: 승인되면 정점에서 얼마를 파는가
  inputs:
  - prevalence_or_incidence
  - dx_rate
  - treat_rate
  - addressable_share
  - price_net_annual
  - persistence
  - compliance
  - geographies_list
  formula: "per geography g, scenario k ∈ {low, base, high}:\n  treated_k = eligible_g × dx_rate × treat_rate × share_peak_k\n  peak_k    = Σ_g treated_k × price_net_g × persistence × compliance\n# 만성질환:\
    \ 유병(prevalence) 기반. 급성·완치: 발생(incidence) 기반. 값은 M02 parameter, 약가는 M01.\n# 시나리오 확률(prob_low/base/high)은 표시만 하고 가중평균으로 합치지 않는다. rNPV(FE-B03)에서만 가중.\n"
  outputs:
  - peak_by_scenario
  - peak_breakdown
  params:
  - M02:유병·발생
  - M02:진단율·치료율
  - M04:점유율 프리셋(경쟁 수·진입 순서)
  - M01:순약가(급여·환급 반영)
  - M04:지속·순응 프리셋
  overrides:
  - id: FE-B01-CGT
    applies_when:
      modality:
      - cell_therapy
      - gene_therapy
    name: 일회성 치료 매출
    formula: '# 1회 투여로 끝나므로 재투여 없음. 첫 수년은 유병 풀(backlog) 소진 + 이후 발생 환자만

      treated_t = min(capacity_t, backlog_remaining_t × uptake + incidence × treat_rate × share)

      revenue_t = treated_t × price_one_time × (1 - outcome_based_rebate)

      # capacity_t = 연간 제조 가능 도즈. 없으면 ''미확보''로 두고 backlog 무제한 가정을 쓰지 않는다

      '
    params:
    - M01:일회성 약가·성과연동 환급
    - M02:유병 풀·발생
    - F04:제조 용량(도즈/년)
  - id: FE-B01-VAC
    applies_when:
      modality:
      - vaccine
    name: 접종 코호트 매출
    formula: 'revenue_t = cohort_t × coverage_rate × doses_per_person × tender_price + private_market_t

      # 국가 접종사업은 입찰 단가·물량, 민간은 소매가. 둘을 나눠 적는다

      '
    params:
    - M02:접종 대상 코호트
    - M01:입찰 단가·민간 가격
    - M04:접종률
  - id: FE-B01-BIOSIM
    applies_when:
      modality:
      - biosimilar
    name: 바이오시밀러 침식 매출
    formula: 'revenue_t = originator_sales_at_LoE × market_erosion(t - LoE) × capture_share_t × (1 - price_discount)

      # 성공확률 매트릭스 대신 원개발사 매출·출시 순서·할인율이 가치를 결정. 출시 시점이 LoE보다 늦으면 capture_share 급감

      '
    params:
    - M04:오리지널 매출·LoE
    - M04:바이오시밀러 침식·점유 곡선(출시 순서별)
    - M01:할인율
  mvp: false
  status: blocked
  pattern: CALC
- id: FE-B02
  group: B
  name: 매출 곡선 — 램프·정체·침식
  question: 출시부터 소멸까지 연도별 매출은 어떻게 흐르는가
  inputs:
  - peak
  - launch_year
  - effective_loe_year
  - disease_group
  - modality
  - regulatory_path
  formula: 'rev_t = peak × ramp(t - launch, disease_group) × erosion(t - effective_loe, modality)

    effective_loe_year = max(patent_expiry_year, exclusivity_end_year(regulatory_path, jurisdiction))

    # ramp: 질환군 프리셋(정점 도달 연수). erosion: 모달리티 프리셋(저분자 급락 / 바이오 완만). 모델링 꼬리 8년

    # effective_loe 미입력 → 계산 보류(무한 매출 차단)

    '
  outputs:
  - rev_series
  - effective_loe_year
  params:
  - M04:램프 프리셋
  - F03:침식 곡선(모달리티별·구 F-VAL-113)
  - R02:독점권 기간(희귀 US7·EU10·JP10·신약 자료보호)
  - T03:특허 만료
  mvp: false
  status: blocked
  pattern: CALC
- id: FE-B03
  group: B
  name: 자산 rNPV (현 단계 기준)
  question: 이 자산은 지금 시점에 얼마의 가치인가
  inputs:
  - rev_series_by_scenario
  - cum_LOA
  - remaining_stages_list
  - margin
  - tax_eff
  - r
  - current_year
  formula: "for k in {low, base, high}:\n  commercial_k = cum_LOA × Σ_t rev_{k,t} × margin × (1 - tax_eff) / (1+r)^{t - current}\n  cost_arm     = Σ_{s ∈ remaining} reach_prob_s × cost_s / (1+r)^{t_s -\
    \ current}\n  rNPV_k       = commercial_k - cost_arm\nrNPV_weighted = Σ_k prob_k × rNPV_k          # 분포(low/base/high)를 함께 표시\n# cum_LOA = C01 누적 (모달리티×단계×질환군, rare면 둘째 줄), reach_prob_s = 조건부 전환확률 누적곱(C01\
    \ conditional)\n# margin = F03 모달리티 총마진(구 F-VAL-114), r = F03 할인율 밴드(구 F-VAL-004) 기본 12%, 8~20 슬라이더\n# 할인율과 PoS로 위험을 이중 계상하지 않는다. cum_LOA 누적과 conditional을 곱해 다시 누적하지 않는다\n"
  outputs:
  - rNPV_by_scenario
  - rNPV_weighted
  - commercial_arm
  - cost_arm
  params:
  - C01:누적·조건부 확률
  - C03:단계 비용
  - C02:단계 기간
  - F03:모달리티 총마진
  - F03:할인율 밴드
  - F03:실효세율 규칙
  overrides:
  - id: FE-B03-BIOSIM
    applies_when:
      modality:
      - biosimilar
    formula: cum_LOA 대신 biosimilar 성공확률(C01 biosimilar 행, 약 80%)과 개발기간 1.5~4년·비용 690~1,380억 파라미터를 쓴다. 매출은 FE-B01-BIOSIM.
  - id: FE-B03-ACC
    applies_when:
      regulatory_path:
      - accelerated_oncology
    formula: P3를 출시 전 비용에서 빼고, 출시 후 확증시험 비용을 cost_arm에 launch 이후 연도로 넣는다. cum_LOA는 P2→승인 조건부(가속승인) 값을 C01에서 따로 읽는다(없으면 '미확보').
  - id: FE-B03-505B2
    applies_when:
      regulatory_path:
      - 505b2_imd
    formula: remaining_stages를 R01 경로 정의로 축소(생략 단계 반영), cum_LOA는 505(b)(2) 전용 값(없으면 '미확보'), 약가는 M01 개량신약 프리미엄 규칙.
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-B04
  group: B
  name: 변곡점 가치와 가치창출 배수
  question: 이 임상에 돈을 쓰면 가치가 얼마나 오르는가
  inputs:
  - rNPV_now
  - rNPV_at_inflection
  - need
  - p_transition
  formula: 'rNPV_at_inflection = FE-B03 with stage = next stage (성공 가정, cum_LOA 갱신, cost_arm에서 완료 단계 제거)

    step_up   = rNPV_at_inflection / rNPV_now

    VCR       = (rNPV_at_inflection - rNPV_now) / need          # 투입 1원당 가치 증가

    EV_of_step = p_transition × rNPV_at_inflection - need         # 기대값(실패 시 0 가정)

    # 단일자산이면 실패 시 잔존가치 0. 플랫폼이면 FE-B10

    '
  outputs:
  - rNPV_at_inflection
  - step_up
  - VCR
  - EV_of_step
  params:
  - C01:조건부 전환확률
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-B05
  group: B
  name: 라이선스 딜 가치 (라이선서 관점)
  question: 변곡점에서 기술이전하면 얼마를 받는가
  applies_when:
    exit_route:
    - license_out
  inputs:
  - deal_terms_candidate
  - rev_series
  - cum_LOA_at_deal
  - r
  formula: "deal_PV = upfront\n        + Σ_i milestone_i × P(reach_i | deal_stage) / (1+r)^{t_i}\n        + Σ_t royalty_pct × rev_t × cum_LOA_at_deal / (1+r)^t\n# 후보 조건이 없으면 M03 컴프 분포(사분위)로 upfront·total을\
    \ 놓고 PV 범위를 낸다. 대표값 하나로 내지 않는다\n"
  outputs:
  - deal_PV_range
  - upfront_pct_of_total
  params:
  - M03:딜 컴프 분포(모달리티×단계×질환군)
  - C01:조건부 확률
  - F03:할인율
  mvp: false
  status: blocked
  pattern: CALC
- id: FE-B06
  group: B
  name: 딜 성립성 (라이선시 관점)
  question: 대형 제약사가 그 값에 살 이유가 있는가
  applies_when:
    exit_route:
    - license_out
  inputs:
  - rNPV_licensee
  - deal_PV
  formula: 'rNPV_licensee = FE-B03 with margin_licensee, r_licensee(대형사 8~10%), remaining cost 100% 부담

    headroom = rNPV_licensee - deal_PV

    flag: headroom < 0 → ''딜 조건이 라이선시에 불리(성립 어려움)''

    '
  outputs:
  - rNPV_licensee
  - headroom
  params:
  - F03:라이선시 할인율·마진 프리셋
  mvp: false
  status: formal
  pattern: CALC
- id: FE-B07
  group: B
  name: 딜 컴프 위치
  question: 같은 조건의 딜에서 우리는 어디쯤인가
  applies_when:
    exit_route:
