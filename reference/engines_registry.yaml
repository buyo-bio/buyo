- id: RE-02
  group: R_axis
  name: 희귀 지정 가능성(법령 기준)
  question: 희귀의약품으로 지정될 수 있는가, 되면 무엇이 달라지는가
  inputs:
  - rare_eligibility_by_jurisdiction
  - existing_therapy_flag
  formula: 'KR: 유병 ≤ 2만 명 ∧ (대체약 없음 ∨ 현저한 개선) → 가능성 Y ; 특례: 우선 허가, 허가 유효기간 10년, 임상 지원, 수수료 감면

    US: <20만 명 → ODD 가능성 ; 7년 독점 + 세액공제 + 사용자 수수료 면제. EU: ≤5/10,000 → 10년

    출력은 ''가능성''과 특례 목록. 지정 여부를 단정하지 않는다

    '
  outputs:
  - designation_likelihood
  - benefits_list
  - exclusivity_years
  params:
  - R02:지정 기준·특례·독점권
