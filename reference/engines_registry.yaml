  formula: 'rule chunks(T02): 모달리티별 알려진 게이트키퍼(예: CAR-T 구조 특허군, LNP 전달 특허군, ADC 링커·페이로드 특허군). 존재 → caution + ''라이선스 필요 여부 확인''. 판정 아님'
