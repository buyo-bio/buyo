  - prevalence_US
  formula: 'KR: prevalence_KR ≤ 20000 → 가능성 Y ; US: prevalence_US < 200000 → Y ; EU: prevalence per 10000 ≤ 5 → Y

    결과는 R축(RE-02)에 넘긴다. 유병 값이 없으면 판정하지 않는다

    '
