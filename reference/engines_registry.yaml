  group: T_axis
  name: 특허 기반 모달리티·적응증 힌트
  question: 특허 분류만으로 이 회사의 약물 종류와 치료 영역을 미리 짐작할 수 있는가
  inputs:
  - ipc_groups_list
  formula: 'modality_hint = T07 표에서 IPC 접두어 매칭 → 최다 건수 태그(동률이면 둘 다). A61P 코드는 적응증 힌트로만

    화면: 입력 화면에서 "특허상 {태그}로 보입니다 — 맞으면 선택" 프리필. 사용자가 확정하기 전에는 저장하지 않는다

    '
  outputs:
  - modality_hint
  - indication_hint_ipc
  params:
  - T07:IPC→모달리티 힌트
  mvp: true
  status: ready
  pattern: CALC
