  status: ready
  pattern: LOOKUP
- id: CE-07
  group: C_axis
  name: 경쟁 임상 밀도
  question: 같은 적응증에 진행 중인 임상이 몇 건인가
  inputs:
  - indication_code
  formula: 'count CT.gov active trials by phase (P1/P2/P3) for indication_code, 최근 5년 등록. 상위 5 의뢰자 표시

    M축 경쟁구도(ME-05)의 입력. 판정은 하지 않는다

    '
  outputs:
  - active_counts_by_phase
  - top_sponsors
  params: []
  mvp: true
  status: ready
  pattern: CALC
- id: CE-08
  group: C_axis
