  - quartiles
  - percentile_of_candidate
  params:
  - M03:딜 컴프 표
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-B08
  group: B
  name: 손익분기 파라미터
  question: 어디까지 나빠져도 가치가 0 이상인가
  inputs:
  - FE-B03 inputs
  formula: 'breakeven_cum_LOA : cum_LOA* s.t. rNPV_base = 0   (이분법)

    breakeven_peak    : peak*    s.t. rNPV_base = 0

    max_trial_cost    : need*    s.t. EV_of_step = 0    (FE-B04)

    margin_of_safety  = (cum_LOA_bench - cum_LOA*) / cum_LOA_bench

    '
  outputs:
  - breakeven_cum_LOA
  - breakeven_peak
  - max_trial_cost
  - margin_of_safety
  params: []
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-B09
  group: B
  name: 설계안 민감도
  question: 설계를 바꾸면 가치가 어떻게 움직이는가
  inputs:
  - FE-B03 inputs
  - design_modifiers
  formula: 'tornado: r ∈ band, cum_LOA ± modifier(C05), peak ∈ {low,high}, duration ± delay → ΔrNPV

    design_delta = rNPV(design B) - rNPV(design A)   (정식판, C05 modifier 청크 확보 후)

    '
  outputs:
  - tornado_table
  - design_delta
  params:
  - C05:설계 modifier(평가변수·대조군·n)
  - F03:할인율 밴드
  mvp: false
  status: formal
  pattern: CALC
- id: FE-B10
  group: B
  name: 하방·단일자산 노출
  question: 리드 자산이 실패하면 무엇이 남는가
  inputs:
  - cash_at_readout
  - backup_assets_list
  - platform_flag
  - need
  formula: 'value_if_fail  = cash_at_readout + Σ backup rNPV + platform_option

    cash_at_readout = cash_available - need

    expected_loss  = (1 - p_transition) × need

    flag single_asset_exposure = (Σ backup rNPV + platform_option) == 0

    '
  outputs:
  - value_if_fail
  - expected_loss
  - single_asset_flag
  params:
  - F03:플랫폼 옵션 산식(구 F-VAL-125·정식)
  mvp: true
  status: ready
  pattern: CALC
- id: FE-B11
  group: B
  name: 희귀의약품 조정
  question: 희귀 지정이 가치에 무엇을 바꾸는가
  applies_when:
    rare:
    - Y
  inputs:
  - jurisdictions_list
  - patent_expiry_year
  formula: 'effective_loe_year = max(patent_expiry_year, approval_year + exclusivity(jurisdiction))   # US 7, EU 10, JP 10, KR 허가 유효 10

    trial_cost   ← C03 × rare_factor (소규모·단일군 허용)

    cum_LOA      ← rare 둘째 줄 값(Wong orphan)과 질환군 값 둘 다 표시

    price_net    ← M01 희귀 약가 프리미엄 규칙(정식)

    fees         ← R02 수수료 감면·우선심사 기간 단축

    '
  outputs:
  - adjusted_inputs_for_FE-B02_B03
  params:
  - R02:독점권 기간·특례
  - F04:희귀 비용 계수
  - C01:rare 행
  mvp: true
  status: blocked
  pattern: CALC
- id: FE-C08
  group: C
  name: 회사 조회·비교군 풀(기업 마스터)
  question: 의뢰사가 상장사인가, 상장사라면 어떤 사업모델·동종 풀에 속하는가
  inputs:
  - company_name_or_code
  formula: 'lookup companies_v2_0 (표준기업명 · 이전사명_별칭 · 종목코드 · DART고유번호) → 상장 여부, 시장, BM코드, Peer그룹, 신약개발_비교군, 거래상태_플래그, 앱화면_우선노출문구

    상장이면 FE-A01 재무 4값을 DART고유번호로 자동 채움(provenance=disclosed), 거래상태_플래그 → FE-A09 입력

    비교군 풀 = 신약개발_비교군 ∈ {Y, Y(주의 플래그)} ∧ Primary_BM ∈ {BM-01, BM-04} (91사) → FE-C01이 이 풀 안에서 모달리티·질환군·단계로 좁힌다

    비상장이면 풀만 반환하고 자동 채움 없음

