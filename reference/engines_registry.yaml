- id: ME-03
  group: M_axis
  name: 급여 채널 판정
  question: 이 약은 어떤 급여·상환 경로로 팔리는가
  inputs:
  - jurisdiction
  - modality
  - disease_group
  - rare
  - administration_setting
  formula: 'rule chunks(M01): KR 급여 등재 경로(신약 경제성평가 / 위험분담제 대상 / 경평 면제 요건), 비급여 자비 시장 여부

    US: Part B(원내 주사) / Part D(경구) / 340B 영향. 출력은 경로명 + 근거 청크. 약가 수치는 ME-04

    '
  outputs:
  - reimbursement_path
  - flags
  params:
  - M01:급여 규칙(기존 M-D01 재태깅)
  mvp: true
  status: ready
  pattern: MATCH
- id: ME-04
  group: M_axis
  name: 순약가 추정
  question: 환자당 연간 순매출 단가는 얼마인가
  inputs:
  - jurisdiction
  - comparator_drugs_list
  - modality
  - rare
  - dosing
  formula: 'list_price_ref = 동일 적응증 기허가 약가(M01 참조약가 표) ; net = list × (1 − gross_to_net(jurisdiction, channel))

    KR: 대체약제 가중평균가·경평 상한 규칙 ; 희귀: 프리미엄 규칙(정식)

    annual_net = net × dosing_per_year (일회성 치료는 총액 1회)

    '
  outputs:
  - annual_net_price_range
  - basis
  params:
  - M01:참조약가·GTN 계수·KR 약가 규칙
  mvp: false
  status: blocked
  pattern: CALC
- id: ME-05
  group: M_axis
  name: 경쟁구도
  question: 승인약과 후기 파이프라인이 몇 개 있고 우리는 몇 번째인가
  inputs:
  - indication_code
  - mechanism_class
  - active_counts_by_phase
  formula: 'approved_n = 승인 DB(정식) ; pipeline_late_n = CE-07 P2+P3 건수

    entry_order_estimate = 1 + count(경쟁 자산 중 우리보다 단계가 앞선 것)

    표시: 숫자와 목록. "포화" 판정은 rule 청크(M04)로만

    '
  outputs:
  - approved_n
  - pipeline_late_n
  - entry_order_estimate
  params:
  - M04:경쟁 밀도 판정 규칙
  mvp: true
  status: blocked
