  mvp: true
  status: blocked
  pattern: LOOKUP
- id: RE-04
  group: R_axis
  name: 신속 프로그램 적격
  question: 가속승인·우선심사·GIFT 같은 제도에 들어갈 수 있는가
  inputs:
  - disease_group
  - unmet_need_flag
  - endpoint_type
  - rare
