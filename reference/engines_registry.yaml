  formula: 'EV_c = market_cap_c - net_cash_c            # 임상단계: EV/Sales 금지, EV/현금·EV/프로그램만(구 F-VAL-008 티어 게이트)

    ev_per_program_c = EV_c / program_count_c

    implied_cum_LOA_c = EV_c / undiscounted_commercial_value_c   # 가능한 경우만

    표시: ev_per_program 사분위 → FE-A06 premoney_reference 후보

