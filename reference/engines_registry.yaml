  formula: 'records = KIPRIS 조회(출원인명 또는 발명자명 또는 특허번호) 또는 사용자 입력 특허번호

    group by IPC 서브그룹(T06 등록부 매칭, 없으면 상위 메인그룹·서브클래스로 완화 + badge)

    각 그룹: 건수, 최근 출원연도, 등록 여부, 존속기간 만료(등록 특허만: 출원일+20년; 아니면 ''미확보''), T06 투자자용 설명 문장

    물질특허 후보 = IPC ∈ {C07K16, C07D, C07C, C07K14, C12N15} ∧ 청구항 제목에 화합물·항체·서열 → badge=substance_candidate (추정, 확정 아님)

    출력은 목록·요약이며 강도 점수는 내지 않는다

    '
  outputs:
  - ipc_groups_list
  - substance_candidates_list
  - earliest_expiry_year
  params:
  - T06:IPC 설명 등록부
  - T07:IPC→모달리티 힌트
  mvp: true
  status: ready
  pattern: CALC
