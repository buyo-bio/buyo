  - duration_kind
  - source_rows
  params:
  - C02:기간 표
  mvp: true
  status: ready
  pattern: LOOKUP
- id: CE-03
  group: C_axis
  name: 대상자 수 벤치마크
  question: 같은 적응증·단계 시험은 보통 몇 명을 모집하는가
  inputs:
