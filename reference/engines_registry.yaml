  formula: 'rule chunks(R02): US BTD(예비 임상 근거 + 중대 질환) / Accelerated Approval(대리 평가변수 + 중대·미충족) / Fast Track / Priority Review

    KR: GIFT(신속심사), 조건부 허가(생명위협·대체 없음)

    출력: 적격 가능성(Y/N/조건) + 기대 효과(심사기간 단축·확증시험 의무). 항암 + 대리 평가변수 → accelerated 후보 플래그

